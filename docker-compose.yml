version: "3.8"
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sharedspaces_api
    ports:
      - "3001:3001"
    volumes:
      - ./apps/api:/app/apps/api
      - /app/apps/api/node_modules
    depends_on:
      - db
      - redis
    env_file:
      - .env

  socket:
    build:
      context: .
      dockerfile: apps/socket-server/Dockerfile
    container_name: sharedspaces_socket
    ports:
      - "4000:4000"
    volumes:
      - ./apps/socket-server:/app/apps/socket-server
      - /app/apps/socket-server/node_modules
    env_file:
      - .env

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: sharedspaces_web
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
    env_file:
      - .env

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: sharedspaces
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: sharedspaces
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata: